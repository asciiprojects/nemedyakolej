# .github/workflows/fetch-remote.yml
- name: Generate PDF & HTML Dump
  run: node generate.js
  
# generate.js içinde:
const browser = await puppeteer.launch();
const page = await browser.newPage();
await page.goto('https://asciipro.net', { waitUntil: 'networkidle0' });

// 1. Temiz HTML Dump
await page.content().then(c => fs.writeFileSync('remote_dump.html', c));

// 2. PDF Üretimi (Orijinal JS/CSS ile Render Edilmiş Hali)
await page.pdf({ 
  path: 'output.pdf', 
  format: 'A4', 
  printBackground: true 
});

await browser.close();
