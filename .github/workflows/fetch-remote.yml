name: Fetch Remote Content
run-name: Crawler ${{ inputs.job_id }}  # ← BU SATIR ZORUNLU!

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Hedef URL'
        required: true
      job_id:
        description: 'Job ID'
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install puppeteer
        
      - name: Generate A3 PDF & TSV
        run: node generate.js "${{ inputs.url }}" "${{ inputs.job_id }}"
        
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-output-${{ inputs.job_id }}
          path: |
            content_A3.pdf
            links.tsv
