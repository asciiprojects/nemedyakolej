name: Fetch Remote Content

on:
  workflow_dispatch: # Manuel tetikleme için zorunlu
  schedule:
    - cron: '0 */4 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Puppeteer
        run: npm install puppeteer-core chromium
        
      - name: Generate TSV & PDF
        run: |
          node generate.js
          
      - name: Commit Results
        run: |
          git config user.name "asciipro-bot"
          git config user.email "bot@asciiprojects.com"
          git add links.tsv content.pdf
          git commit -m "Auto-Fetch: $(date)" || exit 0
          git push