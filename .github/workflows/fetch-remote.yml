name: Fetch Remote Content
on:
  schedule:
    - cron: '0 */4 * * *' # Her 4 saatte bir
  workflow_dispatch:      # Manuel tetikleme

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node & Puppeteer
        run: |
          npm install puppeteer-core chromium
      
      - name: Fetch & Save InnerHTML
        run: node fetch.js
      
      - name: Commit Clean State
        run: |
          git config user.name "asciipro-bot"
          git config user.email "bot@asciiprojects.com"
          git add remote_dump.html
          git commit -m "Auto-Fetch: $(date)" || exit 0
          git push
