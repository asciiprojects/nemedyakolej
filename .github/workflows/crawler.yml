name: AsciiPro Crawler
run-name: Crawler ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: Authorized URL to analyze
        required: true
        type: string
      job_id:
        description: Request identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      REPORT_URL: ${{ inputs.url }}
      JOB_ID: ${{ inputs.job_id }}
      ALLOWED_HOSTS: ${{ vars.CRAWLER_ALLOWED_HOSTS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: pip install reportlab

      - name: Validate URL and create a one-page PDF report
        run: |
          python - <<'PY'
          import os
          import re
          import socket
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, urlunsplit
          from xml.sax.saxutils import escape

          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.platypus import Paragraph, SimpleDocTemplate, Spacer

          raw_url = os.environ["REPORT_URL"].strip()
          job_id = os.environ["JOB_ID"]
          allowed_hosts = {
              item.strip().lower().rstrip(".")
              for item in os.environ.get("ALLOWED_HOSTS", "").split(",")
              if item.strip()
          }

          if not re.fullmatch(r"[a-f0-9]{32}", job_id):
              raise SystemExit("Invalid job_id")

          if not raw_url.lower().startswith(("http://", "https://")):
              raw_url = "https://" + raw_url

          parts = urlsplit(raw_url)
          host = (parts.hostname or "").lower().rstrip(".")

          if (
              parts.scheme != "https"
              or not host
              or host not in allowed_hosts
              or parts.username
              or parts.password
              or (parts.port not in (None, 443))
          ):
              raise SystemExit("URL is not allowed")

          # Normalize away the fragment; do not follow redirects to other hosts.
          url = urlunsplit((parts.scheme, parts.netloc, parts.path or "/", parts.query, ""))

          class TitleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.title_parts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "title":
                      self.in_title = True

              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title_parts.append(data)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          status = "Request not completed"
          page_title = "(not available)"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "AsciiPro-Crawler/1.0"},
          )
          opener = urllib.request.build_opener(NoRedirect)

          try:
              with opener.open(request, timeout=15) as response:
                  status = str(response.status)
                  html = response.read(1_000_000).decode("utf-8", errors="replace")
                  parser = TitleParser()
                  parser.feed(html)
                  page_title = " ".join(" ".join(parser.title_parts).split()) or "(empty)"
          except urllib.error.HTTPError as error:
              # A redirect is recorded, not followed.
              status = str(error.code)
          except (urllib.error.URLError, TimeoutError, socket.timeout) as error:
              status = f"Request failed: {error.reason if hasattr(error, 'reason') else error}"

          output = f"report-{job_id}.pdf"
          styles = getSampleStyleSheet()
          story = [
              Paragraph("AsciiPro URL Report", styles["Title"]),
              Spacer(1, 16),
              Paragraph(f"<b>URL:</b> {escape(url)}", styles["BodyText"]),
              Spacer(1, 8),
              Paragraph(f"<b>HTTP status:</b> {escape(status)}", styles["BodyText"]),
              Spacer(1, 8),
              Paragraph(f"<b>Page title:</b> {escape(page_title)}", styles["BodyText"]),
          ]
          SimpleDocTemplate(output, pagesize=A4).build(story)
          print(f"Created {output}")
          PY

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.job_id }}
          path: report-${{ inputs.job_id }}.pdf
          retention-days: 7
