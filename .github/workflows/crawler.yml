name: AsciiPro Crawler
run-name: Crawler ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: Authorized HTTPS URL
        required: true
        type: string
      job_id:
        description: Request identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install puppeteer
        
      # ← KRİTİK DEĞİŞİKLİK: Parametreli çağrı + Yeni step adı
      - name: Crawler ${{ inputs.job_id }}
        run: node generate.js "${{ inputs.url }}" "${{ inputs.job_id }}"
        
      # ← KRİTİK DEĞİŞİKLİK: Yeni çıktı dosyaları
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.job_id }}
          path: |
            content_A3.pdf
            links.tsv
          retention-days: 1
